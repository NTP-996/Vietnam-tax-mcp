# Legal corpus manifest — the original texts behind every citation.
#
# One entry per document, obtained from an OFFICIAL portal only (Công báo,
# vbpl.vn, vanban.chinhphu.vn, …). Secondary sites were used only to learn a
# document's number and date, never as the stored text. A document that could
# not be found on an official portal stays here with status not_found_official
# and a reason, and has no original and no corpus.
#
# format: pdf       — the bytes as downloaded (Công báo PDF with a text layer)
#         vbpl-html — the document payload of the vbpl.vn page, byte-exact
#                     (the page around it is re-rendered on every request)
# parts:  documents published in several Công báo files list every part;
#         source_url/sha256 repeat part 1.
# Dates are ISO. effective_to is null while the document is in force; an
# amended document stays in force and its amending document has its own entry.
#
# topics:   space-separated topic codes of the tax-law MCP server:
#           hoa_don quan_ly_thue gtgt hkd ke_toan.
# replaces: '; '-separated documents the effect article says this one replaces, as the note
#           records them; absent when the note names none.
#
# Edited by hand; scripts/legal_fetch.py reads it (make legal-fetch / legal-check).
# Nothing here is content-verified: see legal/README.md.
