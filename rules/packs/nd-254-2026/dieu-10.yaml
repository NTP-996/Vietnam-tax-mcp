# UNVERIFIED (verified: false) — the required content of an e-invoice, from
# legal/corpus/nd-254-2026/dieu-10.md (NĐ 254/2026/NĐ-CP Điều 10 khoản 1), not yet signed off by
# the reviewing accountant. Labels are the article's wording; paths point into the canonical
# invoice of services/core/internal/einvoice.
#
# Not modelled (left out on purpose, listed in DESIGN.md §16):
# - điểm a "Tên hóa đơn" — the canonical invoice has no field for the printed name yet;
# - điểm e (signatures), h (thời điểm ký số) and i (mã của cơ quan thuế) — they are set when the
#   invoice is signed and issued, so a draft cannot carry them;
# - điểm k and khoản 2 (fees, discounts, script and currency) — conditional ("nếu có");
# - khoản 3 and the Phụ lục — the cases where an invoice need not carry every item, so a draft
#   for one of them may show a "missing" item that the Phụ lục excuses;
# - khoản 4 (cash-register invoices) — a different content list;
# - for a buyer who is an individual, điểm d allows mã số thuế or số định danh cá nhân: only the
#   business buyer's MST is checked (format only, no look-up of any register).
#
# Before 2026-07-01 the content rule is NĐ 123/2020/NĐ-CP Điều 10, not in the corpus: no_match.
